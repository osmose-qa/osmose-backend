services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INSTALL: -r requirements-dev.txt
    image: osmose-qa/osmose_backend:dev
    volumes:
      - ..:/opt/osmose-backend
      - ../osmose_config_password-example.py:/opt/osmose-backend/osmose_config_password.py:ro
      - /opt/osmose-backend/modules/osm_pbf_parser
    environment:
      - DB_BASE_TEST=osmose
