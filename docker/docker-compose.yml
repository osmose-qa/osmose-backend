services:
  postgis:
    shm_size: 1g
    image: postgis/postgis:18-3.6-alpine
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ./postgis-init.sh:/docker-entrypoint-initdb.d/postgis-init.sh
    environment:
      - POSTGRES_PASSWORD=zei8diu4ohSh
    command: postgres -c synchronous_commit=off -c full_page_writes=off -c max_wal_senders=0 -c wal_level=minimal
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: osmose-qa/osmose_backend
    depends_on:
      - postgis
    volumes:
      - ../osmose_config_password.py:/opt/osmose-backend/osmose_config_password.py:ro
      - ./work:/data/work/osmose
    environment:
      - DB_HOST=postgis
      - JUPYTER_RUNTIME_DIR=/tmp
      #- SENTRY_DSN=
    user: "1000:1000"
    restart: unless-stopped

volumes:
  pgdata:
    ## To keep the data on local directory
